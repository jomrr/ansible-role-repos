---
# role: repos
# file: defaults/main.yml

# Desired presence of selected repositories unless overridden per entry.
# Choices: present, absent
repos_state: present

# Enable new repositories and selected presets unless overridden per entry.
repos_enabled: true

# Verify RPM signatures for new repositories unless overridden per entry.
repos_gpgcheck: true

# Desired APT sources and presets; omitted settings of supplied sources are preserved.
repos_apt: []
# repos_apt:
#   - preset: backports
#     enabled: true
#   - path: /etc/apt/sources.list.d/ubuntu.sources
#     suites: ["{{ ansible_facts.distribution_release }}"]
#     uris: [https://mirror.example.org/ubuntu]

# Desired DNF and DNF5 repositories; name is the repo ID, file the stem without .repo.
repos_dnf: []
# AlmaLinux:
# repos_dnf:
#   - preset: epel
#     baseurl: [https://mirror.example.org/epel/$releasever/Everything/$basearch]
#   - name: extras
#     file: almalinux-extras
#     enabled: true
#     baseurl: [https://mirror.example.org/almalinux/$releasever/extras/$basearch/os]

# Fedora:
# repos_dnf:
#   - name: fedora
#     file: fedora
#     enabled: true
#     baseurl: [https://mirror.example.org/fedora/$releasever/$basearch]

# RPM Fusion sections supplied by an installed rpmfusion-free-release package.
# repos_dnf:
#   - name: rpmfusion-free
#     file: rpmfusion-free
#     enabled: true
#     baseurl: [https://mirror.example.org/rpmfusion/free/fedora/releases/$releasever/Everything/$basearch/os]
#   - name: rpmfusion-free-updates
#     file: rpmfusion-free-updates
#     enabled: true
#     baseurl: [https://mirror.example.org/rpmfusion/free/fedora/updates/$releasever/$basearch]

# Desired Zypper repositories; name is the alias, file defaults to name without .repo.
repos_zypper: []
