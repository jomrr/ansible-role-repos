---
# role: repos
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Declare desired repository settings, including presets and supplied
      sources, in each backend list.
    options:
      repos_state:
        type: str
        default: present
        choices:
          - present
          - absent
        description: Desired state of explicitly defined repositories.
      repos_enabled:
        type: bool
        default: true
        description: Enabled flag for new repositories and selected presets; omitted settings
          of supplied repositories remain unchanged.
      repos_gpgcheck:
        type: bool
        default: true
        description: Signature verification for new RPM repositories; item settings override
          this policy.
      repos_apt:
        type: list
        default: []
        elements: dict
        options:
          name:
            type: str
            description: Repository identifier; APT filename stem, or RPM section ID. Presets
              supply this value.
          state:
            type: str
            choices:
              - present
              - absent
            description: Desired presence; overrides repos_state.
          enabled:
            type: bool
            description: Desired enabled flag; preserved when omitted on a supplied repository.
          types:
            type: list
            elements: str
            choices:
              - deb
              - deb-src
            description: APT package types; defaults to deb.
          uris:
            type: list
            elements: str
            description: Desired archive URIs; required for new sources.
          suites:
            type: list
            elements: str
            description: Suites identifying sources within the file; required for new sources,
              omitted selects the whole file.
          components:
            type: list
            elements: str
            description: Desired archive components; required for new suites that are not
              exact paths.
          architectures:
            type: list
            elements: str
            description: Desired architectures; omitted preserves existing settings.
          signed_by:
            type: str
            description: Repository-scoped keyring path, HTTPS key URL, fingerprint or armored
              public key.
          preset:
            type: str
            description: Distribution preset; supplies target names and default settings
              for this entry.
          path:
            type: path
            description: Absolute APT source path instead of name; suites select sources
              within the file.
          repositories:
            type: list
            elements: dict
            options:
              name:
                type: str
                description: Repository identifier; APT filename stem, or RPM section ID.
                  Presets supply this value.
                required: true
              state:
                type: str
                choices:
                  - present
                  - absent
                description: Desired presence; overrides repos_state.
              enabled:
                type: bool
                description: Desired enabled flag; preserved when omitted on a supplied
                  repository.
              types:
                type: list
                elements: str
                choices:
                  - deb
                  - deb-src
                description: APT package types; defaults to deb.
              uris:
                type: list
                elements: str
                description: Desired archive URIs; required for new sources.
              suites:
                type: list
                elements: str
                description: Suites identifying sources within the file; required for new
                  sources, omitted selects the whole file.
              components:
                type: list
                elements: str
                description: Desired archive components; required for new suites that are
                  not exact paths.
              architectures:
                type: list
                elements: str
                description: Desired architectures; omitted preserves existing settings.
              signed_by:
                type: str
                description: Repository-scoped keyring path, HTTPS key URL, fingerprint
                  or armored public key.
            description: Named settings for individual repositories within the selected
              preset.
        description: Desired APT repositories, selected presets and supplied sources; unspecified
          settings are preserved.
      repos_dnf:
        type: list
        default: []
        elements: dict
        options:
          name:
            type: str
            description: Repository identifier; APT filename stem, or RPM section ID. Presets
              supply this value.
          state:
            type: str
            choices:
              - present
              - absent
            description: Desired presence; overrides repos_state.
          enabled:
            type: bool
            description: Desired enabled flag; preserved when omitted on a supplied repository.
          file:
            type: str
            description: Filename stem below /etc/yum.repos.d; defaults to name; .repo is
              appended.
          description:
            type: str
            description: Repository description; defaults to name.
          baseurl:
            type: list
            elements: str
            description: Repository base URLs; provide baseurl, metalink or mirrorlist when
              present.
          metalink:
            type: str
            description: Metalink URL for the repository.
          mirrorlist:
            type: str
            description: Mirror-list URL for the repository.
          gpgkey:
            type: list
            elements: str
            description: URLs or file URIs of public RPM signing keys.
          gpgcheck:
            type: bool
            description: Desired signature verification; omitted preserves existing settings,
              with repos_gpgcheck used for new repositories.
          repo_gpgcheck:
            type: bool
            description: Verify repository metadata signatures.
          priority:
            type: int
            description: Repository priority; lower values take precedence.
          exclude:
            type: list
            elements: str
            description: Package patterns excluded from this repository.
          includepkgs:
            type: list
            elements: str
            description: Package patterns included from this repository.
          preset:
            type: str
            description: Distribution preset; supplies target names and default settings
              for this entry.
          repositories:
            type: list
            elements: dict
            options:
              name:
                type: str
                description: Repository identifier; APT filename stem, or RPM section ID.
                  Presets supply this value.
                required: true
              state:
                type: str
                choices:
                  - present
                  - absent
                description: Desired presence; overrides repos_state.
              enabled:
                type: bool
                description: Desired enabled flag; preserved when omitted on a supplied
                  repository.
              description:
                type: str
                description: Repository description; defaults to name.
              baseurl:
                type: list
                elements: str
                description: Repository base URLs; provide baseurl, metalink or mirrorlist
                  when present.
              metalink:
                type: str
                description: Metalink URL for the repository.
              mirrorlist:
                type: str
                description: Mirror-list URL for the repository.
              gpgkey:
                type: list
                elements: str
                description: URLs or file URIs of public RPM signing keys.
              gpgcheck:
                type: bool
                description: Desired signature verification; omitted preserves existing
                  settings, with repos_gpgcheck used for new repositories.
              repo_gpgcheck:
                type: bool
                description: Verify repository metadata signatures.
              priority:
                type: int
                description: Repository priority; lower values take precedence.
              exclude:
                type: list
                elements: str
                description: Package patterns excluded from this repository.
              includepkgs:
                type: list
                elements: str
                description: Package patterns included from this repository.
            description: Named settings for individual repositories within the selected
              preset.
        description: Desired DNF repositories, selected presets and supplied sources; unspecified
          settings are preserved.
      repos_zypper:
        type: list
        default: []
        elements: dict
        options:
          name:
            type: str
            description: Repository identifier; APT filename stem, or RPM section ID. Presets
              supply this value.
          state:
            type: str
            choices:
              - present
              - absent
            description: Desired presence; overrides repos_state.
          enabled:
            type: bool
            description: Desired enabled flag; preserved when omitted on a supplied repository.
          repo:
            type: str
            description: Desired repository base URI; required when creating a repository.
          description:
            type: str
            description: Repository description.
          gpgcheck:
            type: bool
            description: Desired signature verification; omitted preserves existing settings,
              with repos_gpgcheck used for new repositories.
          autorefresh:
            type: bool
            description: Desired automatic refresh flag; preserved when omitted, true for
              new repositories.
          auto_import_keys:
            type: bool
            description: Import the repository signing key and refresh after a configuration
              change; defaults to false.
          priority:
            type: int
            description: Repository priority; lower values take precedence.
          preset:
            type: str
            description: Distribution preset; supplies target names and default settings
              for this entry.
          file:
            type: str
            description: Filename stem below /etc/zypp/repos.d; defaults to name; .repo
              is appended.
          repositories:
            type: list
            elements: dict
            options:
              name:
                type: str
                description: Repository identifier; APT filename stem, or RPM section ID.
                  Presets supply this value.
                required: true
              state:
                type: str
                choices:
                  - present
                  - absent
                description: Desired presence; overrides repos_state.
              enabled:
                type: bool
                description: Desired enabled flag; preserved when omitted on a supplied
                  repository.
              repo:
                type: str
                description: Desired repository base URI; required when creating a repository.
              description:
                type: str
                description: Repository description.
              gpgcheck:
                type: bool
                description: Desired signature verification; omitted preserves existing
                  settings, with repos_gpgcheck used for new repositories.
              autorefresh:
                type: bool
                description: Desired automatic refresh flag; preserved when omitted, true
                  for new repositories.
              auto_import_keys:
                type: bool
                description: Import the repository signing key and refresh after a configuration
                  change; defaults to false.
              priority:
                type: int
                description: Repository priority; lower values take precedence.
            description: Named settings for individual repositories within the selected
              preset.
        description: Desired ZYPPER repositories, selected presets and supplied sources;
          unspecified settings are preserved.
