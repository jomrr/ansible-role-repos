---
# role: repos
# file: molecule/resources/playbooks/side_effect.yml

- name: REPOS | Exercise updates and explicit removal
  hosts: all
  gather_facts: true
  tasks:
    - name: REPOS | Predict supplied mirror updates without changing files
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        apply:
          check_mode: true
      vars:
        __repos_test_mirror_version: v2

    - name: REPOS | Verify check mode preserved the converged state
      ansible.builtin.script:
        cmd: >-
          ../scripts/verify_repositories.py initial {{ ansible_facts.pkg_mgr }} {{ ansible_facts.distribution | quote }}
          {{ ansible_facts.distribution_version | quote }}
        executable: python3
      changed_when: false

    - name: REPOS | Update a definition and disable selected repositories
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        __repos_test_mirror_version: v2
        __repos_test_enabled: false

    - name: REPOS | Verify changed definitions and disabled repositories
      ansible.builtin.script:
        cmd: >-
          ../scripts/verify_repositories.py changed {{ ansible_facts.pkg_mgr }} {{ ansible_facts.distribution | quote }}
          {{ ansible_facts.distribution_version | quote }}
        executable: python3
      changed_when: false

    - name: REPOS | Remove only the explicitly selected definition
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        repos_state: absent
        repos_apt:
          - name: molecule-repository
        repos_dnf:
          - name: molecule-repository
        repos_zypper:
          - name: molecule-repository

    - name: REPOS | Verify removal preserves unlisted and preset repositories
      ansible.builtin.script:
        cmd: >-
          ../scripts/verify_repositories.py absent {{ ansible_facts.pkg_mgr }} {{ ansible_facts.distribution | quote }}
          {{ ansible_facts.distribution_version | quote }}
        executable: python3
      changed_when: false
