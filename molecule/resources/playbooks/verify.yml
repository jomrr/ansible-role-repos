---
# role: repos
# file: molecule/resources/playbooks/verify.yml

- name: REPOS | Verify selected repositories
  hosts: all
  gather_facts: true
  tasks:
    - name: REPOS | Validate Backports metadata and signatures with APT
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - apt-get
          - update
          - --error-on=any
          - -o
          - "Dir::Etc::sourcelist=/etc/apt/sources.list.d/{{ ansible_facts.distribution | lower }}-backports.sources"
          - -o
          - Dir::Etc::sourceparts=-
          - -o
          - APT::Get::List-Cleanup=0
      changed_when: false
      when: ansible_facts.pkg_mgr == 'apt'

    - name: REPOS | Verify dispatch, presets and repository overrides
      ansible.builtin.script:
        cmd: >-
          ../scripts/verify_repositories.py initial {{ ansible_facts.pkg_mgr }} {{ ansible_facts.distribution | quote }}
          {{ ansible_facts.distribution_version | quote }}
        executable: python3
      changed_when: false
