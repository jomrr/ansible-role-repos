---
# role: repos
# file: tasks/assert.yml

- name: REPOS | Validate the detected backend
  ansible.builtin.assert:
    that:
      - ansible_facts.pkg_mgr in __repos_backends
    fail_msg: The detected package manager must be APT, DNF, DNF5 or Zypper.
    quiet: true

- name: REPOS | Resolve repository identities and reject conflicting entries
  ansible.builtin.assert:
    that:
      - __repos_repositories is sequence
    quiet: true
