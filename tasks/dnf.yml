---
# role: repos
# file: tasks/dnf.yml

- name: REPOS | Converge selected DNF repositories
  become: true
  become_user: root
  jomrr.general.repo_rpm:
    backend: dnf
    path: "{{ __repos_repository.path }}"
    name: "{{ __repos_repository.name }}"
    state: "{{ __repos_repository.state }}"
    default_enabled: "{{ repos_enabled }}"
    default_gpgcheck: "{{ repos_gpgcheck }}"
    enabled: "{{ __repos_repository.enabled | default(omit) }}"
    description: "{{ __repos_repository.description | default(omit) }}"
    baseurl: "{{ __repos_repository.baseurl | default(omit) }}"
    metalink: "{{ __repos_repository.metalink | default(omit) }}"
    mirrorlist: "{{ __repos_repository.mirrorlist | default(omit) }}"
    gpgkey: "{{ __repos_repository.gpgkey | default(omit) }}"
    gpgcheck: "{{ __repos_repository.gpgcheck | default(omit) }}"
    repo_gpgcheck: "{{ __repos_repository.repo_gpgcheck | default(omit) }}"
    priority: "{{ __repos_repository.priority | default(omit) }}"
    exclude: "{{ __repos_repository.exclude | default(omit) }}"
    includepkgs: "{{ __repos_repository.includepkgs | default(omit) }}"
  loop: "{{ __repos_repositories }}"
  loop_control:
    loop_var: __repos_repository
    label: "{{ __repos_repository.name }}"
