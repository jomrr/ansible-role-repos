---
# role: repos
# file: vars/openSUSE Leap.yml

__repos_presets:
  obs_devel_tools:
    repositories:
      - name: obs-devel-tools
        repo: "https://download.opensuse.org/repositories/devel:/tools/{{ ansible_facts.distribution_version }}/"
        enabled: "{{ repos_presets.obs_devel_tools | default(false) }}"
        auto_import_keys: true
  obs_filesystems:
    repositories:
      - name: obs-filesystems
        repo: "https://download.opensuse.org/repositories/filesystems/{{ ansible_facts.distribution_version }}/"
        enabled: "{{ repos_presets.obs_filesystems | default(false) }}"
        auto_import_keys: true
