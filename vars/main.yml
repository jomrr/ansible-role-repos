---
# role: repos
# file: vars/main.yml

__repos_backends:
  apt: apt
  dnf: dnf
  dnf5: dnf
  zypper: zypper

__repos_directories:
  apt: /etc/apt/sources.list.d
  dnf: /etc/yum.repos.d
  zypper: /etc/zypp/repos.d

# Resolve target identities and presets before any backend writes.
__repos_repositories: >-
  {{ lookup('ansible.builtin.vars', 'repos_' ~ __repos_backends[ansible_facts.pkg_mgr])
     | jomrr.general.repo(__repos_presets, __repos_backends[ansible_facts.pkg_mgr], {'enabled': repos_enabled, 'state': repos_state},
                          __repos_directories[__repos_backends[ansible_facts.pkg_mgr]]) }}
